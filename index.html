<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101418" />
  <title>spiderkaras</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap');

    /* ---- Material 3 dark color roles ---- */
    :root {
      color-scheme: dark;

      --primary: #a8c7fa;
      --on-primary: #062e6f;
      --primary-container: #284777;
      --on-primary-container: #d3e3fd;

      --secondary: #bfc6dc;
      --secondary-container: #3c4358;
      --on-secondary-container: #dbe1f9;

      --tertiary: #d6bee4;
      --tertiary-container: #523f61;
      --on-tertiary-container: #f2daff;

      --surface: #101418;
      --surface-dim: #101418;
      --surface-bright: #36393e;
      --surface-container-lowest: #0b0e12;
      --surface-container-low: #181c20;
      --surface-container: #1c2024;
      --surface-container-high: #272a2f;
      --surface-container-highest: #32353a;

      --on-surface: #e1e2e8;
      --on-surface-variant: #c3c6cf;
      --outline: #8d9199;
      --outline-variant: #43474e;

      /* M3 shape scale */
      --shape-xs: 8px;
      --shape-sm: 12px;
      --shape-md: 16px;
      --shape-lg: 20px;
      --shape-xl: 28px;
      --shape-full: 999px;

      --easing: cubic-bezier(.2, 0, 0, 1);
      --max: 480px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100svh;
      margin: 0;
      font-family: "Roboto Flex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--on-surface);
      background: var(--surface);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

    /* ---- mobile-first shell ---- */
    .page {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      display: grid;
      gap: 12px;
    }

    /* M3 cards = surface container, extra-large shape */
    .card {
      background: var(--surface-container);
      border-radius: var(--shape-xl);
      overflow: hidden;
    }

    /* ---- top app bar ---- */
    .appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 4px;
    }
    .appbar .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .appbar .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 12px 0 10px;
      border-radius: var(--shape-xs);
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-size: 13px;
      font-weight: 500;
      max-width: 60%;
    }
    .status .dot {
      width: 8px; height: 8px; flex: 0 0 auto;
      border-radius: 50%;
      background: var(--primary);
    }
    .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---- hero / profile ---- */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding: 32px 20px 26px;
      background:
        radial-gradient(120% 90% at 50% -10%, var(--primary-container), transparent 60%),
        var(--surface-container);
    }
    .avatar {
      width: 104px; height: 104px;
      border-radius: var(--shape-full);
      padding: 3px;
      background: linear-gradient(135deg, var(--primary), var(--tertiary));
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: var(--shape-full);
      background: var(--surface-container-high);
      display: block;
    }
    .name-row { display: inline-flex; align-items: center; gap: 6px; }
    .profile h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 700;
      letter-spacing: -.02em;
    }

    /* M3 icon button (filled tonal) */
    .icon-btn {
      width: 40px; height: 40px;
      flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: var(--shape-full);
      background: var(--surface-container-highest);
      color: var(--on-surface-variant);
      transition: background .15s var(--easing);
    }
    .icon-btn:hover, .icon-btn:active { background: var(--primary-container); color: var(--on-primary-container); }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* ---- now playing ---- */
    .np { padding: 16px; }
    .np-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
      color: var(--on-surface-variant);
      font-size: 13px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .np-head .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
    .np-head .eq i { width: 3px; background: var(--primary); border-radius: 2px; animation: eq 1s var(--easing) infinite; }
    .np-head .eq i:nth-child(1){ height: 6px; animation-delay: -.2s; }
    .np-head .eq i:nth-child(2){ height: 12px; animation-delay: -.5s; }
    .np-head .eq i:nth-child(3){ height: 8px; animation-delay: 0s; }
    @keyframes eq { 0%,100%{ transform: scaleY(.4);} 50%{ transform: scaleY(1);} }

    .track { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 14px; align-items: center; }
    .cover {
      width: 64px; height: 64px;
      border-radius: var(--shape-sm);
      overflow: hidden;
      background: var(--surface-container-high);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .track h2 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track p { margin: 4px 0 0; color: var(--on-surface-variant); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 14px; color: var(--on-surface-variant); font-size: 12px; font-variant-numeric: tabular-nums; }
    .bar { height: 4px; border-radius: var(--shape-full); background: var(--surface-container-highest); overflow: hidden; }
    .bar i { display: block; width: 0%; height: 100%; background: var(--primary); border-radius: inherit; transition: width .6s linear; }

    /* fallback player */
    .player { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .play-btn {
      width: 48px; height: 48px;
      flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: var(--shape-full);
      background: var(--primary);
      color: var(--on-primary);
      transition: filter .15s var(--easing);
    }
    .play-btn:active { filter: brightness(.92); }
    .play-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .player-meta { min-width: 0; flex: 1; }
    .player-meta strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* inline Spotify player */
    .spotify-embed { display: none; width: 100%; height: 80px; border: 0; border-radius: var(--shape-md); margin-top: 14px; }
    .spotify-embed.is-active { display: block; }

    /* M3 volume slider */
    .volume {
      display: flex; align-items: center; gap: 10px;
      margin-top: 14px;
      color: var(--on-surface-variant);
    }
    .volume svg { width: 20px; height: 20px; flex: 0 0 auto; fill: currentColor; }
    .volume input[type="range"] {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 4px; margin: 0;
      border-radius: var(--shape-full);
      background: var(--surface-container-highest);
      cursor: pointer;
    }
    .volume input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--primary);
      border: 0;
    }
    .volume input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      border: 0; border-radius: 50%;
      background: var(--primary);
    }

    /* ---- socials grid ---- */
    .socials {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .social {
      display: flex; align-items: center; gap: 12px;
      min-height: 64px;
      padding: 12px 14px;
      border-radius: var(--shape-md);
      background: var(--surface-container-high);
      transition: background .15s var(--easing), transform .15s var(--easing);
    }
    .social:active { transform: scale(.97); }
    .social:hover { background: var(--surface-container-highest); }
    .social i {
      width: 40px; height: 40px; flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: var(--shape-full);
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .social i svg { width: 20px; height: 20px; fill: currentColor; }
    .social strong { font-size: 14px; font-weight: 600; }

    /* ---- comments ---- */
    .comments { padding: 16px; background: #15202B !important; }
    .comments h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    .comments-mount { min-height: 120px; background: #15202B; border-radius: var(--shape-md); }
    .comments-mount iframe { background: #15202B !important; }
    .comments-fallback { margin: 0; color: var(--on-surface-variant); font-size: 13px; }

    /* ---- footer ---- */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px;
      color: var(--on-surface-variant);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* text swap animation */
    .smooth-text { display: inline-block; transition: opacity .25s var(--easing), transform .25s var(--easing); }
    .smooth-text.is-changing { opacity: 0; transform: translateY(4px); }

    /* ---- scale up on larger screens (mobile-first) ---- */
    @media (min-width: 600px) {
      :root { --max: 520px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

            <svg viewBox="0 0 24 24"><path d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 0 1-9.58 2H5.26A7 7 0 0 0 19 13c0-3.87-3.13-7-7-7Z"/></svg>

      </section>

      <section class="card socials" id="socials">
        <a class="social" data-social="steam" target="_blank" rel="noreferrer"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11.98 0C5.68 0 .51 4.86.02 11.04l6.43 2.66a3.38 3.38 0 0 1 1.91-.59h.19l2.86-4.14v-.06a4.57 4.57 0 1 1 4.57 4.53h-.11l-4.07 2.9v.16a3.39 3.39 0 0 1-6.72.67L.44 15.27A12 12 0 1 0 11.98 0Zm-3.62 18.75a2.25 2.25 0 0 0 2.24-2.25 2.25 2.25 0 0 0-2.24-2.24c-.17 0-.33.02-.49.05l1.07.44a1.66 1.66 0 1 1-1.29 3.06l-1-.42a2.24 2.24 0 0 0 1.71 1.36Zm7.62-6.83a3.01 3.01 0 1 0 0-6.02 3.01 3.01 0 0 0 0 6.02Zm0-.75a2.26 2.26 0 1 1 0-4.52 2.26 2.26 0 0 1 0 4.52Z"/></svg></i><strong>Steam</strong></a>
        <a class="social" data-social="discord" target="_blank" rel="noreferrer"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.32 4.37A19.79 19.79 0 0 0 15.37 2c-.22.39-.47.92-.64 1.34a18.27 18.27 0 0 0-5.46 0A13.5 13.5 0 0 0 8.63 2a19.74 19.74 0 0 0-4.95 2.38C.55 9.04-.3 13.59.12 18.08a19.9 19.9 0 0 0 6.07 3.07c.49-.67.92-1.38 1.29-2.13-.71-.27-1.38-.6-2.02-.97.17-.12.33-.25.49-.38a14.2 14.2 0 0 0 12.1 0l.49.38c-.64.38-1.32.7-2.02.97.37.75.8 1.46 1.29 2.13a19.86 19.86 0 0 0 6.07-3.07c.5-5.2-.85-9.72-3.56-13.71ZM8.02 15.33c-1.18 0-2.15-1.08-2.15-2.41 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.1 2.15 2.42 0 1.33-.95 2.41-2.15 2.41Zm7.96 0c-1.18 0-2.15-1.08-2.15-2.41 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.1 2.15 2.42 0 1.33-.95 2.41-2.15 2.41Z"/></svg></i><strong>Discord</strong></a>

      <section class="card comments" id="comments">

      <span><span id="localTime">--:--</span> · UTC+3</span>

  <script>
    const PROFILE = {
      nicknames: ["spiderkarasXD", "spidorkaras", "spiderkaras"],
      discordId: "1407136994764525749",
      avatar: "./picture.png",

      socials: {
        steam: "https://store.steampowered.com/",
        discord: "https://discord.com/users/1407136994764525749",
        spotify: "https://open.spotify.com/",
        tiktok: "https://www.tiktok.com/@spiderkaras_",
        telegram: "https://t.me/spiderkaras"
      },

      fallbackTrack: {
        title: "Water Resistant — Anamanaguchi",
        src: "./SpotiDownloader.com%20-%20Water%20Resistant%20-%20Anamanaguchi.mp3",
        cover: "https://api.dicebear.com/9.x/shapes/svg?seed=lofi&backgroundColor=1c2024"
      }
    };

    const PLAY = '<path d="M8 5v14l11-7z"/>';
    const PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    const $ = (s) => document.querySelector(s);
    const state = { nick: 2, start: 0, end: 0, timer: 0, ws: null, heartbeat: 0, spotifyTrackId: "" };

    function safeHref(url) { return url && url !== "#" ? url : "#"; }

    function swapText(target, value, instant = false) {
      if (!target || target.textContent === value) return;
      if (instant) { target.textContent = value; return; }
      target.classList.add("is-changing");
      window.setTimeout(() => {
        target.textContent = value;
        target.classList.remove("is-changing");
      }, 180);
    }

    function setNick(index, instant = false) {
      state.nick = (index + PROFILE.nicknames.length) % PROFILE.nicknames.length;
      const nick = PROFILE.nicknames[state.nick];
      swapText($("#nickname"), nick, instant);
      swapText($("#brandNick"), nick, instant);
      swapText($("#footerNick"), nick, instant);
      document.title = nick;
    }

    function nextNick() { setNick(state.nick + 1); }

    function renderProfile() {
      $("#avatar").src = PROFILE.avatar;
      document.querySelectorAll("[data-social]").forEach((a) => a.href = safeHref(PROFILE.socials[a.dataset.social]));
      $("#lofiAudio").src = PROFILE.fallbackTrack.src;
      $("#lofiAudio").volume = Number($("#volume").value);
      $("#playerTitle").textContent = PROFILE.fallbackTrack.title;
      setNick(state.nick, true);
    }

    function fmt(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    }

    function stopProgress() { if (state.timer) clearInterval(state.timer); state.timer = 0; }

    function updateProgress() {
      const total = Math.max(1, state.end - state.start);
      const elapsed = Math.min(Math.max(0, Date.now() - state.start), total);
      $("#elapsed").textContent = fmt(elapsed);
      $("#duration").textContent = fmt(total);
      $("#bar").style.width = `${Math.round((elapsed / total) * 100)}%`;
      if (elapsed >= total) stopProgress();
    }

    function setSpotifyPlayer(trackId) {
      const embed = $("#spotifyEmbed");
      if (!trackId) {
        embed.classList.remove("is-active");
        embed.removeAttribute("src");
        state.spotifyTrackId = "";
        return;
      }
      if (state.spotifyTrackId !== trackId) {
        embed.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0`;
        state.spotifyTrackId = trackId;
      }
      embed.classList.add("is-active");
    }

    function setFallbackPlayer(active) {
      const audio = $("#lofiAudio");
      $("#lofiControls").style.display = active ? "block" : "none";
      if (!active) { audio.pause(); $("#playIcon").innerHTML = PLAY; return; }
      $("#playerTitle").textContent = PROFILE.fallbackTrack.title;
      if (PROFILE.fallbackTrack.cover) { $("#cover").src = PROFILE.fallbackTrack.cover; $("#cover").hidden = false; }
    }

    async function toggleLofi() {
      const audio = $("#lofiAudio");
      if (!audio.src) audio.src = PROFILE.fallbackTrack.src;
      try {
        if (audio.paused) { await audio.play(); $("#playIcon").innerHTML = PAUSE; }
        else { audio.pause(); $("#playIcon").innerHTML = PLAY; }
      } catch { /* autoplay blocked */ }
    }

    function setIdle(title = "ничего не играет") {
      stopProgress();
      $("#trackTitle").textContent = title;
      $("#trackArtist").textContent = PROFILE.fallbackTrack.title;
      $("#trackLink").href = PROFILE.fallbackTrack.src;
      $("#elapsed").textContent = "0:00";
      $("#duration").textContent = "∞";
      $("#bar").style.width = "100%";
      $("#presenceText").textContent = "lofi fallback";
      setSpotifyPlayer("");
      setFallbackPlayer(true);
    }

    // Render a Lanyard presence object (same shape from REST and WebSocket).
    function applyPresence(data) {
      const sp = data?.spotify;

      if (data?.discord_user?.avatar) {
        $("#avatar").src = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.png?size=160`;
      }

      if (!sp) return setIdle("не слушаю Spotify");

      stopProgress();
      setFallbackPlayer(false);
      $("#trackTitle").textContent = sp.song || "Unknown track";
      $("#trackArtist").textContent = `${sp.artist || "Unknown artist"} · ${sp.album || ""}`;
      $("#presenceText").textContent = "listening on Spotify";
      $("#trackLink").href = sp.track_id ? `https://open.spotify.com/track/${sp.track_id}` : PROFILE.socials.spotify;
      setSpotifyPlayer(sp.track_id || "");

      if (sp.album_art_url) { $("#cover").src = sp.album_art_url; $("#cover").hidden = false; }

      state.start = sp.timestamps?.start || Date.now();
      state.end = sp.timestamps?.end || Date.now();
      updateProgress();
      state.timer = setInterval(updateProgress, 1000);
    }

    // Real-time presence via Lanyard WebSocket (same mechanism Discord uses),
    // so updates are instant instead of polling every N seconds.
    function connectLanyard() {
      const id = PROFILE.discordId.trim();
      if (!/^[0-9]{17,22}$/.test(id)) return setIdle("нужен Discord ID");

      let ws;
      try { ws = new WebSocket("wss://api.lanyard.rest/socket"); }
      catch { return setIdle("RPC недоступен"); }
      state.ws = ws;

      ws.addEventListener("message", (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        if (msg.op === 1) {
          // Hello: start heartbeat and subscribe to this Discord user.
          clearInterval(state.heartbeat);
          state.heartbeat = setInterval(() => {
            if (ws.readyState === 1) ws.send(JSON.stringify({ op: 3 }));
          }, msg.d.heartbeat_interval);
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: id } }));
        } else if (msg.op === 0) {
          // INIT_STATE / PRESENCE_UPDATE — d is the presence object.
          const data = msg.d && msg.d.discord_user ? msg.d : (msg.d?.[id] || msg.d);
          applyPresence(data);
        }
      });

      ws.addEventListener("close", () => {
        clearInterval(state.heartbeat);
        setTimeout(connectLanyard, 3000); // auto-reconnect like a Discord client
      });
      ws.addEventListener("error", () => { try { ws.close(); } catch {} });
    }

    function loadComments() {
      const mount = $("#commentsMount");
      mount.textContent = "";
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://comments.app/js/widget.js?3";
      script.dataset.commentsAppWebsite = "PlNVWl0S";
      script.dataset.limit = "5";
      script.dataset.dislikes = "1";
      script.dataset.outlined = "1";
      script.dataset.colorful = "1";
      script.dataset.dark = "1";
      mount.appendChild(script);
    }

    function tickClock() {
      $("#localTime").textContent = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    }

    renderProfile();
    tickClock();

    $("#nickButton").addEventListener("click", nextNick);
    $("#playButton").addEventListener("click", toggleLofi);
    $("#volume").addEventListener("input", (e) => { $("#lofiAudio").volume = Number(e.target.value); });

    setInterval(nextNick, 3200);
    setInterval(tickClock, 15000);
    connectLanyard();

    if ("requestIdleCallback" in window) requestIdleCallback(loadComments, { timeout: 2500 });
    else setTimeout(loadComments, 1400);
  </script>
</body>
</html>
